<!DOCTYPE html>
<html>
<head>
    <title>Prediction Records</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            padding: 18px 40px;
            color: white;
        }

        .navbar h2 {
            margin: 0;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #111827;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
        }

        .date {
            color: #6b7280;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {
            .container {
                width: 95%;
            }

            .card {
                padding: 15px;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Stock Prediction System</h2>
</div>

<div class="container">

    <div class="title">
        <h2>Prediction Records</h2>

        <p class="subtitle">
            View prediction activity generated by system users.
        </p>
    </div>

    <div class="card">

        <table>

            <tr>
                <th>User</th>
                <th>Stock</th>
                <th>Predicted Price</th>
                <th>Date</th>
            </tr>

            {% for p in predictions %}

            <tr>
                <td>
                    {{p[0]}}
                </td>

                <td>
                    {{p[1]}}
                </td>

                <td class="price">
                    ₹{{p[2]}}
                </td>

                <td class="date">
                    {{p[3]}}
                </td>
            </tr>

            {% endfor %}

        </table>

    </div>

    <a class="back" href="/admin/dashboard">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
